services:
  postgres:
    image: postgres:16-alpine
    container_name: skillscraper_db
    environment:
      POSTGRES_DB: skillsdb
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills_pass
    ports:
      - "5434:5432"
    volumes:
      - skills_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skills -d skillsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  skills_pgdata:
    name: skillscraper_pgdata
